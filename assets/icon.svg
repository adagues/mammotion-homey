<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Robot mower top-down view -->
  <g fill="#000">
    <!-- Main body - rounded rectangle -->
    <rect x="200" y="250" width="600" height="500" rx="120" ry="120"/>
    <!-- Wheels - 4 AWD wheels -->
    <rect x="160" y="320" width="80" height="140" rx="30"/>
    <rect x="760" y="320" width="80" height="140" rx="30"/>
    <rect x="160" y="540" width="80" height="140" rx="30"/>
    <rect x="760" y="540" width="80" height="140" rx="30"/>
    <!-- RTK Antenna -->
    <circle cx="500" cy="310" r="35"/>
    <rect x="488" y="220" width="24" height="90" rx="12"/>
    <!-- Cutting blade indicator lines -->
    <line x1="350" y1="620" x2="650" y2="620" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <line x1="370" y1="660" x2="630" y2="660" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <!-- Front sensor bar -->
    <rect x="310" y="390" width="380" height="20" rx="10" fill="#fff" opacity="0.3"/>
  </g>
</svg>